spring:
  datasource:
    url: jdbc:h2:mem:rurublog_test;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

blog:
  data-dir: ${java.io.tmpdir}/rurublog-tests
  public-url: http://localhost
  admin:
    secret-hash: "{noop}test-secret"
    session-timeout: 1h
  ai:
    openai:
      enabled: false
      base-url: https://api.openai.com
      api-key: ""
      model: gpt-4o-mini
      completions-path: /v1/chat/completions
      timeout: 45s
      temperature:
    classification:
      auto-run: false
      delay-after-save: 1s
      minimum-confidence: 0.50
      review-confidence: 0.75
      min-tags: 0
      max-tags: 5
  backup:
    enabled: false
    retention-count: 2
  upload:
    max-file-size: 1MB
