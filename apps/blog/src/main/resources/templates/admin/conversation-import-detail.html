<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('导入详情')}"></head>
<body>
<header th:replace="~{fragments/admin :: header}"></header>
<main class="admin-shell narrow-admin">
    <div th:replace="~{fragments/admin :: flash}"></div>
    <div class="admin-title"><div><p class="eyebrow">CONVERSATION IMPORT</p><h1 th:text="${#strings.isEmpty(job.sourceTitle) ? '未命名分享内容' : job.sourceTitle}">导入详情</h1><p><span th:text="${job.provider.label}">来源</span> · <span th:text="${job.questionAnswerCount + ' 组问答 / ' + job.messageCount + ' 条消息 / ' + job.characterCount + ' 字符'}"></span></p></div></div>
    <section class="panel stack-form">
        <div><strong>任务状态</strong> <span class="status" th:text="${job.status}">状态</span></div>
        <p th:if="${job.status.name() == 'PENDING'}">正在等待其他 AI 任务完成，本页会自动刷新。</p>
        <p th:if="${job.status.name() == 'RUNNING'}">正在整理全部问答并生成一篇文章，本页会自动刷新。</p>
        <p class="form-errors" th:if="${job.errorMessage}" th:text="${job.errorMessage}">错误</p>
        <a th:if="${job.article != null}" th:href="@{/admin/articles/{id}(id=${job.article.id})}">打开生成的文章草稿 →</a>
        <form th:if="${job.status.name() == 'EXTRACTED' || job.status.name() == 'FAILED'}" th:action="@{/admin/conversation-imports/{id}/generate(id=${job.id})}" method="post">
            <button class="primary" type="submit" th:disabled="${!aiEnabled}" th:text="${job.status.name() == 'FAILED' ? '重新生成草稿' : '生成文章草稿'}">生成文章草稿</button>
            <small th:if="${!aiEnabled}">请先在 AI 设置中启用生成模型。</small>
        </form>
    </section>
    <section class="panel" th:if="${snapshot != null}">
        <h2>提取预览</h2>
        <div class="conversation-preview" th:each="message, stat : ${snapshot.messages}">
            <strong th:text="${message.role.name() == 'USER' ? '提问' : '回答'}">消息</strong>
            <pre th:text="${#strings.abbreviate(message.content, 2000)}">内容</pre>
        </div>
    </section>
    <p><a th:href="@{/admin/conversation-imports}">← 返回导入列表</a></p>
</main>
<script th:if="${job.status.name() == 'PENDING' || job.status.name() == 'RUNNING'}">setTimeout(() => location.reload(), 5000);</script>
</body>
</html>
