<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head(${article == null ? '新建文章' : '编辑文章'})}"></head>
<body>
<header th:replace="~{fragments/admin :: header}"></header>
<main class="editor-shell">
    <div th:replace="~{fragments/admin :: flash}"></div>
    <form id="article-form" class="editor-form" th:action="@{/admin/articles/save}" method="post" th:object="${articleForm}">
        <input type="hidden" th:field="*{id}">
        <div class="editor-toolbar">
            <div><a th:href="@{/admin/articles}">← 文章列表</a><span class="save-state" data-save-state th:text="${article == null ? '首次请手动保存' : '已保存'}">已保存</span></div>
            <div class="button-row">
                <button type="button" data-preview-toggle>切换预览</button>
                <button class="primary" type="submit">保存</button>
            </div>
        </div>
        <div class="form-errors" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}">错误</p></div>
        <div class="editor-grid">
            <section class="editor-main">
                <div class="title-field">
                    <label for="title" data-title-label>标题（可选）</label>
                    <input id="title" class="title-input" th:field="*{title}" maxlength="200" data-title-input placeholder="AI 自动判断时可留空">
                    <small data-title-hint>留空后会从正文生成内部标题；若 AI 判断为动态或摘录，前台不会显示该标题。</small>
                </div>
                <div class="inline-fields">
                    <label>正文格式<select th:field="*{contentType}" data-content-type><option th:each="type : ${contentTypes}" th:value="${type}" th:text="${type}"></option></select></label>
                    <label class="content-form-field">内容形态<select th:field="*{contentForm}" data-content-form th:attr="data-resolved-form=${article == null ? 'LONGFORM' : article.contentForm.name()}"><option value="">AI 自动判断</option><option th:each="form : ${contentForms}" th:value="${form}" th:text="${form.label}"></option></select><small data-content-form-hint>AI 会同时判断形态、分类和标签</small></label>
                    <label>固定链接<input th:field="*{slug}" maxlength="220" placeholder="留空自动生成"></label>
                </div>
                <label class="content-field-label" for="content">正文</label>
                <div class="markdown-tools" data-markdown-tools>
                    <button type="button" data-insert="## 标题">H2</button><button type="button" data-wrap="**">加粗</button><button type="button" data-prefix="> ">引用</button><button type="button" data-block="```java&#10;// code&#10;```">代码</button><button type="button" data-block="| 列一 | 列二 |&#10;| --- | --- |&#10;| 内容 | 内容 |">表格</button><button type="button" data-block="```mermaid&#10;flowchart LR&#10;  A[开始] --> B[结束]&#10;```">流程图</button><button type="button" data-wrap-link>链接</button>
                </div>
                <textarea id="content" class="content-editor" th:field="*{content}" data-content-editor required spellcheck="false"></textarea>
                <section class="editor-preview article-content" data-editor-preview hidden></section>
            </section>
            <aside class="editor-sidebar">
                <label>分类<select th:field="*{categoryId}" required><option th:each="category : ${leafCategories}" th:value="${category.id}" th:text="${category.pathName}"></option></select></label>
                <label>标签<input th:field="*{tags}" maxlength="500" placeholder="咖啡, 周末, Java"><small>使用逗号分隔，0–5 个；不必凑数</small></label>
                <div class="file-picker editor-file-picker" data-file-picker>
                    <input id="editor-media" class="file-picker-input" type="file" data-media-upload accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/markdown,application/zip">
                    <label class="file-picker-surface" for="editor-media">
                        <span class="file-picker-icon"><svg th:replace="~{fragments/icons :: icon('image')}"></svg></span>
                        <span class="file-picker-copy"><strong>添加图片或附件</strong><small data-file-name>点击选择，或把文件拖到这里</small></span>
                        <span class="file-picker-action">选择文件</span>
                    </label>
                    <small class="file-picker-status" data-upload-state>选择后自动上传并插入正文；图片也可直接粘贴</small>
                </div>
                <section class="excerpt-fields" data-excerpt-fields th:hidden="${article == null || article.contentForm.name() != 'EXCERPT'}">
                    <p class="sidebar-section-title">摘录来源</p>
                    <label>出处<input th:field="*{sourceCitation}" maxlength="300" placeholder="例如：陆游《冬夜读书示子聿》"><small>只填写正文中明确存在的作者、书名或来源</small></label>
                    <label>来源链接<input th:field="*{sourceUrl}" type="url" maxlength="1000" placeholder="https://"></label>
                </section>
                <label>摘要<textarea th:field="*{summary}" rows="5" maxlength="1000" placeholder="留空则自动生成"></textarea><small>自动或 AI 摘要只用于列表与 SEO；只有人工摘要会显示为正文导语</small></label>
                <label>SEO 标题<input th:field="*{seoTitle}" maxlength="200"></label>
                <label>SEO 描述<textarea th:field="*{seoDescription}" rows="3" maxlength="500"></textarea></label>
                <label class="checkbox"><input type="checkbox" th:field="*{pinned}"> 置顶文章</label>
                <label class="checkbox"><input type="checkbox" th:field="*{classificationLocked}" data-classification-lock> 锁定当前分类结果</label>
                <div class="ai-result" th:if="${article != null}">
                    <strong>AI 分类</strong>
                    <span class="status" th:text="${article.classificationStatus}">PENDING</span>
                    <p th:text="'内容形态：' + ${article.contentForm.label}"></p>
                    <p th:if="${article.classificationConfidence != null}" th:text="'置信度：' + ${#numbers.formatDecimal(article.classificationConfidence, 1, 2)}"></p>
                    <p th:if="${article.classificationReason}" th:text="${article.classificationReason}"></p>
                </div>
                <div class="ai-result" th:if="${article != null}">
                    <strong>相似内容检测</strong>
                    <span class="status" th:if="${similarityResult != null}" th:text="${similarityResult.risk.label}">结果</span>
                    <p th:if="${similarityResult == null}">尚未检测；发布前会自动检查。</p>
                    <p th:if="${similarityResult != null && !similarityResult.current}">正文已变化，当前结果已过期。</p>
                    <th:block th:if="${similarityResult != null && similarityResult.current}">
                        <p th:if="${similarityResult.matchedArticle != null}">最相似：<a th:href="@{/admin/articles/{id}(id=${similarityResult.matchedArticle.id})}" th:text="${similarityResult.matchedArticle.title}">文章</a></p>
                        <p th:text="${'文本 ' + #numbers.formatPercent(similarityResult.lexicalScore, 1, 0) + ' · 段落覆盖 ' + #numbers.formatPercent(similarityResult.paragraphCoverage, 1, 0)}"></p>
                        <p th:if="${similarityResult.semanticScore != null}" th:text="${'语义 ' + #numbers.formatPercent(similarityResult.semanticScore, 1, 0) + ' · 语义覆盖 ' + #numbers.formatPercent(similarityResult.semanticCoverage, 1, 0)}"></p>
                        <p th:if="${similarityResult.embeddingCandidates > 0}" th:text="${'语义索引覆盖 ' + similarityResult.embeddingCompared + ' / ' + similarityResult.embeddingCandidates}"></p>
                        <p th:if="${!#strings.isEmpty(similarityResult.matchedExcerpt)}" th:text="${'相似片段：' + similarityResult.matchedExcerpt}"></p>
                    </th:block>
                </div>
            </aside>
        </div>
    </form>
    <div class="editor-actions" th:if="${article != null}">
        <form th:action="@{/admin/articles/{id}/classify(id=${article.id})}" method="post" onsubmit="return confirm('重新分类会解除人工分类锁，AI 结果可能覆盖当前分类、内容形态和标签。确认继续？')"><button type="submit">重新 AI 分类</button></form>
        <form th:action="@{/admin/articles/{id}/similarity(id=${article.id})}" method="post"><button type="submit">检查相似内容</button></form>
        <form th:if="${article.status.name() != 'PUBLISHED' && (similarityResult == null || !similarityResult.current || !similarityResult.risk.confirmationRequired)}" th:action="@{/admin/articles/{id}/publish(id=${article.id})}" method="post"><button class="primary" type="submit">发布文章</button></form>
        <form th:if="${article.status.name() != 'PUBLISHED' && similarityResult != null && similarityResult.current && similarityResult.risk.confirmationRequired}" th:action="@{/admin/articles/{id}/publish(id=${article.id})}" method="post" onsubmit="return confirm('这篇文章疑似与已发布内容重复。确认仍然发布吗？')"><input type="hidden" name="similarityConfirmed" value="true"><button class="danger" type="submit">确认仍然发布</button></form>
        <form th:if="${article.status.name() == 'PUBLISHED'}" th:action="@{/admin/articles/{id}/withdraw(id=${article.id})}" method="post"><button type="submit">撤回为草稿</button></form>
        <form th:if="${article.status.name() != 'TRASHED'}" th:action="@{/admin/articles/{id}/trash(id=${article.id})}" method="post" onsubmit="return confirm('确定移入回收站吗？')"><button class="danger" type="submit">移入回收站</button></form>
        <form th:if="${article.status.name() == 'TRASHED'}" th:action="@{/admin/articles/{id}/restore(id=${article.id})}" method="post"><button type="submit">恢复为草稿</button></form>
        <form th:if="${article.status.name() == 'TRASHED'}" th:action="@{/admin/articles/{id}/delete(id=${article.id})}" method="post" onsubmit="return confirm('此操作不能撤销。文章历史与 AI 任务会一并删除，但资源文件会保留。确定永久删除？')"><button class="danger" type="submit">永久删除</button></form>
    </div>
</main>
<script th:src="@{/webjars/highlightjs__cdn-assets/11.11.1/highlight.min.js}"></script>
<script th:src="@{/webjars/katex/0.16.44/dist/katex.min.js}"></script>
<script th:src="@{/webjars/katex/0.16.44/dist/contrib/auto-render.min.js}"></script>
<script th:src="@{/js/article.js}" th:attr="data-mermaid-src=@{/webjars/mermaid/11.17.1/dist/mermaid.min.js}"></script>
<script th:src="@{/js/file-picker.js}"></script>
<script th:src="@{/js/editor.js}"></script>
</body>
</html>
