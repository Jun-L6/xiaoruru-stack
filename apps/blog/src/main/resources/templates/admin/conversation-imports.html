<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('对话转文章')}"></head>
<body>
<header th:replace="~{fragments/admin :: header}"></header>
<main class="admin-shell">
    <div th:replace="~{fragments/admin :: flash}"></div>
    <div class="admin-title"><div><p class="eyebrow">CONVERSATION IMPORT</p><h1>对话转文章</h1><p>支持 ChatGPT 与 DeepSeek 的公开分享链接；服务器只发送 HTTP 请求，不运行浏览器。</p></div></div>
    <form class="panel stack-form" th:action="@{/admin/conversation-imports/extract}" method="post">
        <label for="source-url">分享链接
            <input id="source-url" name="sourceUrl" type="url" maxlength="1000" required
                   placeholder="https://chatgpt.com/share/...">
        </label>
        <small>提取不会调用 AI。确认消息数量和内容后，再手动提交生成草稿。</small>
        <button class="primary" type="submit">提取并预览</button>
    </form>
    <section class="panel">
        <h2>最近导入</h2>
        <div class="table-wrap"><table class="admin-table"><thead><tr><th>来源</th><th>标题</th><th>问答</th><th>状态</th><th>创建时间</th><th></th></tr></thead>
            <tbody><tr th:each="job : ${imports}">
                <td th:text="${job.provider.label}">来源</td>
                <td th:text="${job.displayTitle}">标题</td>
                <td th:text="${job.questionAnswerCount}">0</td>
                <td><span class="status" th:text="${job.status.label}">状态</span></td>
                <td th:text="${#temporals.format(job.createdAt, 'yyyy-MM-dd HH:mm:ss')}">时间</td>
                <td><a th:href="@{/admin/conversation-imports/{id}(id=${job.id})}">查看</a></td>
            </tr></tbody>
        </table><p class="empty-state" th:if="${imports.empty}">还没有导入记录。</p></div>
    </section>
</main>
</body>
</html>
