<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle}, ${description})}"></head>
<body>
<div class="reading-progress" data-reading-progress aria-hidden="true" th:if="${!article.contentForm.compact}"></div>
<header th:replace="~{fragments/site :: header}"></header>
<main class="article-shell" th:classappend="${'form-' + article.contentForm.name().toLowerCase()}"
      th:attr="data-reading-width=${site['site.article-width']},data-reading-size=${site['site.article-font-size']},data-reading-leading=${site['site.article-line-height']},data-code-theme=${site['site.code-theme']}">
    <div class="article-layout">
      <article>
        <header class="article-heading" th:classappend="${article.titleDisplayed ? '' : ' titleless'}">
            <p class="breadcrumbs"><a th:href="@{/}">首页</a> / <a th:href="@{/categories/{slug}(slug=${article.category.slug})}" th:text="${article.category.pathName}">分类</a></p>
            <h1 th:if="${article.titleDisplayed}" th:text="${article.title}">文章标题</h1>
            <p class="article-meta">
                <span class="form-badge" th:text="${article.contentForm.label}">长文</span>
                发布于 <time th:text="${#temporals.format(article.publishedAt, 'yyyy-MM-dd HH:mm')}">时间</time>
                <span> · 更新于 <time th:text="${#temporals.format(article.updatedAt, 'yyyy-MM-dd HH:mm')}">时间</time></span>
            </p>
            <p class="article-lead" th:if="${article.manualSummary && !article.contentForm.compact}" th:text="${article.summary}">摘要</p>
            <div class="tag-row" th:if="${!article.tags.empty}">
                <a class="tag" th:each="tag : ${article.tags}" th:href="@{/tags/{slug}(slug=${tag.slug})}" th:text="${tag.name}">标签</a>
            </div>
        </header>
        <div class="article-content" data-article-content th:utext="${article.renderedHtml}"></div>
        <p class="article-source article-detail-source" th:if="${article.contentForm.name() == 'EXCERPT' && (article.sourceCitation != null || article.sourceUrl != null)}">
            <cite th:if="${article.sourceCitation != null}" th:text="${article.sourceCitation}">出处</cite>
            <a th:if="${article.sourceUrl != null}" th:href="${article.sourceUrl}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>
        </p>
        <nav class="article-neighbors" th:if="${previousArticle != null || nextArticle != null}" aria-label="相邻文章">
            <a th:if="${previousArticle != null}" th:href="@{/posts/{slug}(slug=${previousArticle.slug})}"><small>上一篇</small><span th:text="${previousArticle.title}">上一篇文章</span></a>
            <span th:if="${previousArticle == null}"></span>
            <a class="next" th:if="${nextArticle != null}" th:href="@{/posts/{slug}(slug=${nextArticle.slug})}"><small>下一篇</small><span th:text="${nextArticle.title}">下一篇文章</span></a>
        </nav>
      </article>
      <aside class="article-toc-rail" th:if="${!article.contentForm.compact && site['site.toc-mode'] != 'hidden'}" data-article-toc-rail>
          <button class="article-toc-toggle" type="button" data-article-toc-toggle aria-controls="article-toc" aria-expanded="false" disabled>
              <span data-article-toc-toggle-label>目录加载中…</span><span aria-hidden="true">⌃</span>
          </button>
          <nav id="article-toc" class="article-toc" data-article-toc data-state="loading" aria-busy="true" aria-label="文章目录">
              <strong><span class="eyebrow">ON THIS PAGE</span> 本文目录</strong>
              <div class="article-toc-loading" role="status"><span>正在整理目录…</span><i></i><i></i><i></i><i></i></div>
              <p class="article-toc-empty">正文没有分节标题</p>
              <ol></ol>
          </nav>
      </aside>
    </div>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
<script defer th:src="@{/js/article.js}" th:attr="data-mermaid-src=@{/webjars/mermaid/11.17.1/dist/mermaid.min.js}"></script>
<script defer th:src="@{/webjars/highlightjs__cdn-assets/11.11.1/highlight.min.js}"></script>
<script defer th:src="@{/webjars/katex/0.16.44/dist/katex.min.js}"></script>
<script defer th:src="@{/webjars/katex/0.16.44/dist/contrib/auto-render.min.js}"></script>
</body>
</html>
