# scripts/init-blog.py generates application.yml with unique credentials.
# The real application.yml is private, mode 600, and is never overwritten.
spring:
  datasource:
    password: '__DATABASE_PASSWORD__'
blog:
  admin:
    secret: '__ADMIN_SECRET__'
  ai:
    enabled: false
  backup:
    enabled: true
    retention-count: 7
