name: xiaoruru

services:
  xui:
    image: ${XUI_IMAGE}
    container_name: xiaoruru-xui
    hostname: xui
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ}
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_DB_FOLDER: /etc/x-ui
      XUI_LOG_FOLDER: /var/log/x-ui
      XUI_PORT: ${XUI_PANEL_PORT}
      XUI_INIT_WEB_BASE_PATH: ${XUI_WEB_BASE_PATH}
      XUI_MEMORY_LIMIT: ${XUI_MEMORY_LIMIT_MB}
    volumes:
      - ./data/x-ui:/etc/x-ui
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/logs/x-ui:/var/log/x-ui
    expose:
      - "${XUI_PANEL_PORT}/tcp"
      - "${XUI_SUB_PORT}/tcp"
    ports:
      - "${XRAY_PORT}:${XRAY_PORT}/tcp"
      - "${XRAY_PORT}:${XRAY_PORT}/udp"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${XUI_PANEL_PORT}${XUI_WEB_BASE_PATH} >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  nginx:
    image: ${NGINX_IMAGE}
    container_name: xiaoruru-nginx
    restart: unless-stopped
    init: true
    depends_on:
      xui:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      XUI_PANEL_PORT: ${XUI_PANEL_PORT}
      XUI_SUB_PORT: ${XUI_SUB_PORT}
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/templates:/etc/nginx/templates:ro
      - ./data/nginx-runtime:/etc/nginx/conf.d
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-webroot:/var/www/certbot:ro
      - ./data/logs/nginx:/var/log/nginx
    ports:
      - "${HTTP_PORT}:80/tcp"
      - "${HTTPS_PORT}:443/tcp"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  gost:
    image: ${GOST_IMAGE}
    container_name: xiaoruru-gost
    restart: unless-stopped
    init: true
    depends_on:
      nginx:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/xiaoruru/gost-entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      GOST_USERNAME: ${GOST_USERNAME}
      GOST_PASSWORD: ${GOST_PASSWORD}
      GOST_PORT: ${GOST_PORT}
      GOST_LOGGER_LEVEL: info
    volumes:
      - ./config/gost/gost.yml.template:/etc/gost/gost.yml.template:ro
      - ./scripts/gost-entrypoint.sh:/opt/xiaoruru/gost-entrypoint.sh:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "${GOST_PORT}:${GOST_PORT}/tcp"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"

  certbot:
    image: ${CERTBOT_IMAGE}
    container_name: xiaoruru-certbot
    profiles: ["ops"]
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-webroot:/var/www/certbot
    networks:
      - edge

  panel-init:
    image: ${PANEL_INIT_IMAGE}
    profiles: ["ops"]
    init: true
    depends_on:
      xui:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      DOCKER_SUBNET: ${DOCKER_SUBNET}
      XUI_PANEL_PORT: ${XUI_PANEL_PORT}
      XUI_SUB_PORT: ${XUI_SUB_PORT}
      XUI_WEB_BASE_PATH: ${XUI_WEB_BASE_PATH}
      XUI_ADMIN_USERNAME: ${XUI_ADMIN_USERNAME}
      XUI_ADMIN_PASSWORD: ${XUI_ADMIN_PASSWORD}
      XRAY_PORT: ${XRAY_PORT}
      PRIMARY_CLIENT_EMAIL: ${PRIMARY_CLIENT_EMAIL}
      REALITY_MIN_CLIENT_VER: ${REALITY_MIN_CLIENT_VER}
      REALITY_TARGET_CANDIDATES: ${REALITY_TARGET_CANDIDATES}
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python3", "/opt/xiaoruru/init-panel.py"]
    volumes:
      - ./scripts/init-panel.py:/opt/xiaoruru/init-panel.py:ro
      - ./data/bootstrap-output:/output
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    name: xiaoruru-edge
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
