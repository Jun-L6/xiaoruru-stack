name: xiaoruru

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  nginx-ui:
    image: ${NGINX_UI_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NGINX_UI_NODE_SKIP_INSTALLATION: "true"
      NGINX_UI_PREDEFINED_USER_NAME: ${GATEWAY_USERNAME}
      NGINX_UI_PREDEFINED_USER_PASSWORD: ${GATEWAY_PASSWORD}
      NGINX_UI_SERVER_RUN_MODE: release
      NGINX_UI_CERT_EMAIL: ${LE_EMAIL}
      NGINX_UI_IGNORE_DOCKER_SOCKET: "true"
      NGINX_UI_LOGROTATE_ENABLED: "true"
      NGINX_UI_LOGROTATE_INTERVAL: "1440"
    volumes:
      - ./data/gateway/nginx:/etc/nginx
      - ./data/gateway/nginx-ui:/etc/nginx-ui
      - ./data/gateway/certificates:/etc/letsencrypt:ro
      - ./data/gateway/acme:/var/www/certbot:ro
      - ./data/gateway/logs:/var/log/nginx
    ports: ["80:80", "443:443"]
    networks: [gateway]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  xui:
    profiles: [vpn]
    image: ${XUI_IMAGE}
    restart: unless-stopped
    init: true
    depends_on:
      nginx-ui: {condition: service_healthy}
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      TZ: Asia/Shanghai
      XUI_DB_FOLDER: /etc/x-ui
      XUI_LOG_FOLDER: /var/log/x-ui
      XUI_PORT: "2053"
      XUI_INIT_WEB_BASE_PATH: /
      XUI_MEMORY_LIMIT: "400"
      XUI_ENABLE_FAIL2BAN: "true"
    volumes:
      - ./data/vpn/xui:/etc/x-ui
      - ./data/vpn/logs:/var/log/x-ui
      - ./data/gateway/certificates:/etc/letsencrypt:ro
    ports: ["8443:8443/tcp", "8443:8443/udp"]
    networks: [gateway]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2053/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  gost:
    profiles: [proxy]
    image: ${GOST_IMAGE}
    restart: unless-stopped
    init: true
    depends_on:
      nginx-ui: {condition: service_healthy}
    command: ["-C", "/etc/gost/config.json"]
    labels:
      beer.xiaoruru.config-hash: ${GOST_CONFIG_HASH}
    volumes:
      - ./data/vpn/gost:/etc/gost:ro
      - ./data/gateway/certificates:/etc/letsencrypt:ro
    ports: ["9443:9443"]
    networks: [gateway]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  rurublog:
    profiles: [blog]
    image: ${BLOG_IMAGE}
    build:
      context: ./apps/blog
      target: runtime
      args:
        BLOG_SOURCE_HASH: ${BLOG_SOURCE_HASH:-unversioned}
        BLOG_BUILD_TESTS: ${BLOG_BUILD_TESTS:-false}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    depends_on:
      nginx-ui: {condition: service_healthy}
    environment:
      TZ: Asia/Shanghai
      BLOG_DATA_DIR: /data
      BLOG_PUBLIC_URL: https://${BLOG_DOMAIN}
      BLOG_COOKIE_SECURE: "true"
      SERVER_TOMCAT_THREADS_MAX: "32"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
    volumes:
      - type: bind
        source: ./data/blog/config
        target: /app/config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/blog/runtime
        target: /data
        bind: {create_host_path: false}
    networks: [gateway]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 128
    stop_grace_period: 30s
    logging: *logging

  certbot:
    profiles: [tools]
    image: ${CERTBOT_IMAGE}
    volumes:
      - ./data/gateway/certificates:/etc/letsencrypt
      - ./data/gateway/acme:/var/www/certbot
      - ./data/gateway/certbot-logs:/var/log/letsencrypt
    networks: [gateway]

  panel-init:
    profiles: [tools]
    image: ${PANEL_INIT_IMAGE}
    environment:
      XUI_DOMAIN: ${VPN_DOMAIN}
      CERT_NAME: xiaoruru-services
      DOCKER_SUBNET: ${DOCKER_SUBNET}
      XUI_PANEL_PORT: "2053"
      XUI_SUB_PORT: "2096"
      XUI_WEB_BASE_PATH: /
      XUI_ADMIN_USERNAME: ${VPN_USERNAME}
      XUI_ADMIN_PASSWORD: ${VPN_PASSWORD}
      XRAY_PORT: "8443"
      PRIMARY_CLIENT_EMAIL: main
      REALITY_MIN_CLIENT_VER: "1.0.0"
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python3", "/opt/init-panel.py"]
    volumes:
      - ./manager/runtime/init-panel.py:/opt/init-panel.py:ro
      - ./data/vpn/output:/output
    networks: [gateway]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK}
